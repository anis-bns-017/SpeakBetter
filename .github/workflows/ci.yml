name: CI

# Runs on every push to master and on every pull request.
#
# Gate status as measured on the dev machine (2026-10-30):
#   server typecheck  PASS   (tsc --noEmit, clean)
#   server tests      PASS   (unit tests, plus the session/privacy/socket suites
#                            that need PostgreSQL: see the postgres service below)
#   web typecheck     FAIL   (~364 errors: 306 unused-local, ~58 real type errors)
#
# Update 2026-11-11: web typecheck and build pass (0 errors), so both now block.
# Update 2026-11-13: web lint is clean (0 problems) and now blocks too. Server lint stays non-blocking.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # prisma.config.ts calls env('DATABASE_URL') while the config loads, so
  # `prisma generate` throws if this is unset. A placeholder is enough for
  # generate/typecheck/build; the DB-backed tests use TEST_DATABASE_URL below.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
  # Throwaway database for the suites that need real PostgreSQL (row locks,
  # advisory locks, atomic updates). The name must contain "test": the suites
  # refuse to run against anything else.
  TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/speakbetter_test?schema=public

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: speakbetter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d speakbetter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # Must precede setup-node so `cache: pnpm` can locate pnpm.
      # Matches package.json devEngines.packageManager (^11.17.0).
      # If this version does not resolve, use the version that generated
      # pnpm-lock.yaml (12.8.1 on the dev machine).
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # There is no postinstall hook, so the Prisma client is never
      # generated automatically. Without this the server cannot typecheck
      # or build, because @prisma/client ships no generated types.
      - name: Generate Prisma client
        run: pnpm --filter server exec prisma generate

      - name: Typecheck
        run: pnpm --filter server exec tsc --noEmit -p tsconfig.build.json

      # Applies every migration to the throwaway database, which also proves
      # the migration chain (including the session-rotation backfill) runs.
      - name: Prepare test database
        run: pnpm --filter server exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Test
        run: pnpm --filter server exec jest --ci --passWithNoTests --runInBand
        env:
          AUTH_TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Build
        run: pnpm --filter server run build

      # Non-blocking: remove continue-on-error once existing violations
      # are fixed, otherwise lint findings stay invisible.
      - name: Lint (non-blocking)
        continue-on-error: true
        run: pnpm --filter server exec eslint "{src,test}/**/*.ts"

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter web exec tsc --noEmit -p tsconfig.app.json

      - name: Build
        run: pnpm --filter web run build

      - name: Lint
        run: pnpm --filter web exec eslint .

      - name: Test
        run: pnpm --filter web run test
