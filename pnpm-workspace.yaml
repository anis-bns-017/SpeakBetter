packages:
  - "apps/*"
  - "packages/*"
  - "server"
allowBuilds:
  '@prisma/engines': false
  '@scarf/scarf': true
  bcrypt: true
  prisma: false
  unrs-resolver: true
patchedDependencies:
  '@nestjs/cli@11.0.24': patches/@nestjs__cli@11.0.24.patch
# The phone app (apps/mobile) and expo's own packages must share one expo-constants (a native module can't be
# bundled twice). Keep it equal to apps/mobile's expo-constants; move both up together with expo.
overrides:
  expo-constants: 58.0.14
  # Security fixes for packages that sit under the server and web app (pnpm audit --prod): each is the first patched
  # version of the same major, so nothing here changes behaviour. Re-run `pnpm audit --prod` after bumping.
  axios: ^1.20.0
  body-parser: ^2.4.0
  multer: ^2.5.0
  proxy-addr: ^2.0.8
  engine.io: ^6.6.10
  fast-uri: ^3.1.7
  find-my-way: ^9.7.0
  follow-redirects: ^1.16.2
  react-router: ^7.18.2
  react-router-dom: ^7.18.2
  "js-yaml@^4": ^4.3.2
  "js-yaml@^5": ^5.2.2
