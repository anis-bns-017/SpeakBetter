version: '3.8'

services:

  postgres:
    image: postgres:16-alpine
    container_name: lingoverse_db
    environment:
      POSTGRES_USER: lingo
      POSTGRES_PASSWORD: lingopass
      POSTGRES_DB: lingoverse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: lingoverse_redis
    ports:
      - "6379:6379"

  meilisearch:
    image: getmeili/meilisearch:v1.7
    container_name: lingoverse_search
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: "masterKey"
    volumes:
      - meili_data:/meili_data

  livekit:
    image: livekit/livekit-server:latest
    container_name: lingoverse_livekit
    command: --dev
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    environment:
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret

volumes:
  postgres_data:
  meili_data: