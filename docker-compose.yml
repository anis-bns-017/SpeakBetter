version: '3.8'

services:

  postgres:
    image: postgres:16-alpine
    container_name: lingoverse_db
    environment:
      POSTGRES_USER: lingo
      POSTGRES_PASSWORD: lingopass
      POSTGRES_DB: speakbetter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: lingoverse_redis
    # The API hangs at start-up without Redis, so bring it back after a reboot
    restart: unless-stopped
    ports:
      - "6379:6379"

  meilisearch:
    image: getmeili/meilisearch:v1.7
    container_name: lingoverse_search
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: "masterKey"
    volumes:
      - meili_data:/meili_data

  # Voice rooms and calls. Start it with `pnpm livekit` (scripts/livekit.mjs), which fills in LIVEKIT_NODE_IP.
  # Browsers send voice straight to LiveKit at the address and ports it announces. Inside Docker it only knows its
  # container address (172.17.x.x), which nothing outside can reach, so it announces this computer's Wi-Fi address
  # instead, and the two media ports keep the same numbers outside Docker as inside.
  livekit:
    image: livekit/livekit-server:v1.13.5
    container_name: lingoverse_livekit
    restart: unless-stopped
    command: --dev --bind 0.0.0.0 --node-ip ${LIVEKIT_NODE_IP:-127.0.0.1}
    ports:
      - "18080:7880"     # signalling: VITE_LIVEKIT_URL / LIVEKIT_WS_URL
      - "7881:7881"      # voice over TCP (fallback)
      - "7882:7882/udp"  # voice over UDP
    environment:
      LIVEKIT_KEYS: "devkey: secret"

volumes:
  postgres_data:
  meili_data: