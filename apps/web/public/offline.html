<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <title>You're offline - SpeakBetter</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0b1020; color: #f1f5f9; }
        p { color: #94a3b8; }
      }
      main { max-width: 22rem; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 1.4rem; margin: 1.25rem 0 0.5rem; }
      p { margin: 0 0 1.5rem; color: #64748b; line-height: 1.5; }
      button {
        font: inherit;
        font-weight: 600;
        border: 0;
        border-radius: 999px;
        padding: 0.7rem 1.6rem;
        background: #4f46e5;
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>SpeakBetter needs an internet connection to load. Check your connection, then try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
