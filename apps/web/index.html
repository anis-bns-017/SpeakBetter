<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Type: Fraunces for page titles and big numbers, Plus Jakarta Sans for everything else (apps/web/DESIGN_SYSTEM.md) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3b4fb2" />
    <meta name="description" content="Practise English out loud, every day: live voice rooms and calls with other learners, gentle corrections, and reviews timed to how you remember. Free to use." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SpeakBetter" />
    <meta property="og:title" content="SpeakBetter: speak English out loud, every day" />
    <meta property="og:description" content="Live voice rooms and calls with other learners, gentle corrections, and reviews timed to how you remember. Free to use." />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SpeakBetter" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>SpeakBetter</title>
    <script>
      // Apply the saved theme before the first paint, so dark and navy never flash white.
      // Keep in step with applyTheme in src/lib/theme.ts.
      (function () {
        var pref = "system";
        try { pref = localStorage.getItem("speakbetter-theme") || "system"; } catch (e) {}
        var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = pref === "light" || pref === "dark" || pref === "navy" ? pref : dark ? "dark" : "light";
        var root = document.documentElement;
        if (theme !== "light") root.classList.add("dark");
        root.setAttribute("data-theme", theme);
        root.style.colorScheme = theme === "light" ? "light" : "dark";
        var bar = { light: "#3b4fb2", dark: "#0b0b14", navy: "#0b1631" }[theme];
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", bar);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
